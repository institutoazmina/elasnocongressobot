services:
  raspador:
    build: ./
    image: elasnocongresso_v1:latest
    volumes:
      - ./:/usr/src/app/
      - ./logs:/logs
      - ./data:/data
      - hugging_cache:/home/app/.cache/huggingface
    environment:
      # Nunca baixa modelos em tempo de execução; use src/prefetch_models.py (ver README)
      - HF_HUB_OFFLINE=1
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-file: '100'
        max-size: 1m
    restart: unless-stopped
    depends_on:
      - redis

  redis:
    image: redis:latest
    networks:
      - backend
    restart: unless-stopped

volumes:
  hugging_cache:

networks:
    backend:
      driver: bridge
