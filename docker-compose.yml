services:
  robo:
    build: ./
    image: src-and-data_elasnacamera:latest
    container_name: elasnacamera
    volumes:
      - ./:/usr/src/app/
      - ./logs:/logs
      - ./data:/data
      - hugging_cache:/home/app/.cache/huggingface
    environment:
      # Nunca baixa modelos em tempo de execução; use src/prefetch_models.py (ver README)
      - HF_HUB_OFFLINE=1
    networks:
      - elasnacamera_network
    logging:
      driver: "json-file"
      options:
        max-file: '100'
        max-size: 1m
    restart: unless-stopped
    depends_on:
      - redis

  redis:
    image: redis:latest
    container_name: redis_elasnacamera
    networks:
      - elasnacamera_network
    restart: unless-stopped

volumes:
  hugging_cache:

networks:
    elasnacamera_network:
      driver: bridge
      name: elasnacamera_network
